<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>dropdeck — choose your path</title>
<meta name="description" content="dropdeck — ugc content, built to be seen. for creators and for brands.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{--red:#EE2324;--pink:#FFE4E4;--black:#120D0B;--teal:#8EDBDC;--white:#FBFBFB;--mono:'JetBrains Mono',ui-monospace,monospace;}
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{background:var(--black);color:var(--white);font-family:var(--mono);overflow:hidden;}
  .stage{position:relative;height:100svh;min-height:600px;overflow:hidden;}
  canvas[data-ascii]{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:crosshair;z-index:0;}
  .stage::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
    background:radial-gradient(ellipse at center, rgba(18,13,11,.15) 0%, rgba(18,13,11,.72) 68%, rgba(18,13,11,.96) 100%);}
  nav{position:absolute;top:0;left:0;right:0;z-index:3;display:flex;align-items:center;justify-content:space-between;
    padding:22px clamp(20px,5vw,64px);pointer-events:none;}
  nav .mark{height:30px;width:auto;display:block;pointer-events:auto;}
  nav a.login{pointer-events:auto;font-size:12.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
    color:var(--pink);text-decoration:none;border:1.5px solid rgba(255,228,228,.5);padding:8px 16px;border-radius:30px;white-space:nowrap;}
  nav a.login:hover{background:var(--pink);color:var(--black);border-color:var(--pink);}
  .center{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:24px;pointer-events:none;}
  .eyebrow{font-size:12px;font-weight:500;letter-spacing:.32em;text-transform:uppercase;color:var(--teal);margin-bottom:20px;}
  h1{font-size:clamp(34px,7.4vw,88px);font-weight:800;letter-spacing:-.02em;line-height:.92;text-transform:uppercase;
    color:var(--white);margin-bottom:44px;text-shadow:0 4px 30px rgba(0,0,0,.4);}
  .paths{display:flex;gap:20px;flex-wrap:wrap;justify-content:center;pointer-events:auto;}
  .path{display:flex;flex-direction:column;gap:7px;min-width:248px;max-width:320px;padding:26px 30px;
    border:2px solid var(--pink);border-radius:18px;background:rgba(18,13,11,.55);backdrop-filter:blur(3px);
    color:var(--pink);text-decoration:none;text-align:left;transition:transform .14s ease, background .14s ease, color .14s ease, border-color .14s ease;}
  .path b{font-size:23px;font-weight:800;letter-spacing:-.01em;text-transform:lowercase;}
  .path span{font-size:12.5px;letter-spacing:.04em;line-height:1.5;color:rgba(255,228,228,.72);}
  .path:hover{transform:translateY(-4px);background:var(--red);border-color:var(--red);color:var(--white);}
  .path:hover span{color:rgba(255,255,255,.88);}
  .foot{position:absolute;bottom:18px;left:0;right:0;z-index:3;text-align:center;font-size:11px;
    letter-spacing:.2em;text-transform:uppercase;color:rgba(255,228,228,.45);pointer-events:none;}
  @media(max-width:560px){.paths{flex-direction:column;}h1{margin-bottom:34px;}}
</style>
</head>
<body>
  <div class="stage">
    <canvas data-ascii data-src="/site/assets/ph-hero-fur.png" data-cell="11" data-lens-radius="180"
      data-bg="#120D0B" data-color="#EE2324" data-dim="#8A1B1D" data-faint="#3A1011"
      aria-label="a dropdeck creator rendered in ascii characters; move your cursor to reveal the photograph"></canvas>

    <nav>
      <img class="mark" src="/site/assets/v2-wordmark-pink.png" alt="dropdeck">
      <a class="login" href="/login">log in &rarr;</a>
    </nav>

    <div class="center">
      <p class="eyebrow">ugc, built to be seen</p>
      <h1>Choose<br>your path.</h1>
      <div class="paths">
        <a class="path" href="/creators">
          <b>i'm a creator &rarr;</b>
          <span>get cast to a brand, briefed weekly, paid monthly.</span>
        </a>
        <a class="path" href="/brands">
          <b>i'm a brand &rarr;</b>
          <span>a curated deck of ugc creators, built to be seen.</span>
        </a>
      </div>
    </div>

    <div class="foot">&copy; dropdeck 2026</div>
  </div>
  <script src="/site/ascii-art.js"></script>
</body>
</html>
